<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#020617" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Accent Neon Cyan/Emerald Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Wave Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base / App Icon Frame -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="111" fill="none" stroke="#1e293b" stroke-width="4" opacity="0.8" />

  <!-- Outer Protective Medical Shield Outline -->
  <path d="M 256,90 
           C 335,115 390,130 405,175 
           C 415,265 375,360 256,425 
           C 137,360 97,265 107,175 
           C 122,130 177,115 256,90 Z" 
        fill="none" 
        stroke="url(#primaryGrad)" 
        stroke-width="12" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        opacity="0.35" />

  <!-- Glowing Central Anesthesia Wave / Airway Loop (Laryngo-Monitor Glyph) -->
  <path d="M 125,265 
           L 185,265 
           L 205,215 
           L 225,325 
           L 255,160 
           L 285,355 
           L 305,265 
           L 330,265
           C 365,265 375,225 350,200
           C 320,170 270,185 256,220" 
        fill="none" 
        stroke="url(#primaryGrad)" 
        stroke-width="18" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)" />

  <!-- Ambient Center Light Dot -->
  <circle cx="256" cy="220" r="10" fill="#38bdf8" filter="url(#glow)" />
</svg>
