<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- KetofolDoc Signature Blue-to-Emerald Gradient -->
    <linearGradient id="ketofolGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="iconShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect width="512" height="512" rx="120" fill="url(#ketofolGrad)" filter="url(#iconShadow)" />

  <!-- Clean Activity / ECG Waveform Glyph -->
  <polyline 
    points="80,256 150,256 205,96 307,416 362,256 432,256" 
    fill="none" 
    stroke="#ffffff" 
    stroke-width="40" 
    stroke-linecap="round" 
    stroke-linejoin="round" />
</svg>
